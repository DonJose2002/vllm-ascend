# llm-ops configuration - sourced by llm-start.sh / llm-stop.sh / llm-status.sh
# Run from the SERVER HOST (this repo is bind-mounted there; the scripts only
# touch the host: npu-smi / docker exec / curl).
#
# THE API KEY IS NOT IN GIT (public fork!): each host keeps it in
# ./llm-ops.secret next to the scripts (gitignored). Create it once:
#   echo 'API_KEY="experiment_serve_20260902"' > llm-ops.secret
#   chmod 600 llm-ops.secret

# NOTE: container name is legacy (says 0.23.0 but this is the v0.25.1rc1
# service container) - kept as-is per user decision 2026-09-02; rename when
# the container is ever recreated.
CONTAINER="vllm_0.23.0_serve_liuzilin"
PORT="8792"
API_KEY=""   # filled by llm-ops.secret; scripts refuse to run when empty

# Docker invocation wrapper. This host requires sudo for docker (the ops user
# is not in the docker group - 2026-09-02 incident: bare `docker top` failed
# silently and llm-stop reported "no serve process" while serve was running).
# Set DOCKER="docker" only if the user is in the docker group. NOTE: sudo may
# prompt for a password - run these scripts from an interactive shell.
DOCKER="sudo docker"

MODEL_DIR="/nfs-share/hf_weights/Qwen3.8-27B"
SERVED_NAME="qwen3.8-27b"
MAX_MODEL_LEN="262144"
GPU_MEM_UTIL="0.9"
TP="2"

# Cards whose HBM usage exceeds this are considered occupied by someone
# else's job (free-card driver noise measured ~3.4GB on 910B3).
HBM_FREE_MB="6144"

# Max seconds llm-stop.sh waits for the cards to drain after TERM.
DRAIN_WAIT_MAX="900"

# Graceful-shutdown window before hard kill. The service is STATELESS (KV
# cache is ephemeral, nothing worth flushing) and vLLM's polite shutdown can
# stall for minutes waiting on keep-alive HTTP connections - so keep this
# short; hard kill + HBM drain is the real success criterion.
TERM_WAIT="60"

# The group runs an OCCUPANCY SQUATTER container that periodically grabs
# idle cards doing nothing (makes group usage look high, 2026-09-02 intel).
# When llm-start finds insufficient free cards it restarts this container
# ONCE and retries (user-sanctioned). Cards our llm-stop releases may get
# re-squatted too - harmless, the next start kicks them off the same way.
# Set to "" to disable the auto-restart.
SQUAT_CONTAINER="npu_run"

# Log file INSIDE the container (docker exec -d output is not captured by
# `docker logs`; view via llm-status.sh or docker exec tail).
LOG="/root/serve.log"

# Agent tool calling (2026-09-02 opencode incident: every agent request sends
# tool_choice=auto and vLLM 400s with "'auto' tool choice requires
# --enable-auto-tool-choice and --tool-call-parser"). ENABLE_TOOLS=0 to serve
# plain-chat only.
ENABLE_TOOLS="1"
TOOL_PARSER="qwen3_xml"      # Qwen3.8 chat template emits XML-style calls:
                             #   <tool_call><function=NAME><parameter=P>V</parameter>
                             #   </function></tool_call>   (verified from the
                             # template's own instructions 2026-09-02)
                             # hermes was WRONG for this model: it matched the
                             # <tool_call> tags, failed the inner-JSON regex and
                             # swallowed the call entirely -> opencode saw an
                             # empty post-thinking turn and terminated silently.
# Split <think> blocks into reasoning_content so agents can render thinking
# separately. Empty string disables.
REASONING_PARSER="qwen3"
